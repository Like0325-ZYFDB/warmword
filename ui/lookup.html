<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一瞥</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .search { flex: 1; position: relative; display: flex; align-items: center; }
  .search svg.i { position: absolute; left: 11px; color: var(--text-3); width: 17px; height: 17px; pointer-events: none; }
  .search input { width: 100%; height: 38px; padding: 0 36px 0 36px; font-size: 15px; border-radius: 9px; background: var(--surface); border-color: transparent; }
  .search input:focus { background: var(--bg); }
  .search .clear { position: absolute; right: 5px; }
  main { display: grid; grid-template-columns: 210px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 8px 6px; }
  aside .title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--text-3); padding: 4px 8px 6px; }
  aside .title a { font-size: 12px; color: var(--text-3); }
  aside .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; cursor: pointer;
    padding: 5px 10px; border-radius: 6px; font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  aside .item:hover { background: var(--hover); }
  aside .item.on { background: var(--accent-soft); color: var(--accent-text); }
  #content { overflow-y: auto; min-width: 0; position: relative; }
  #jump { position: sticky; top: 0; z-index: 2; display: flex; gap: 4px; padding: 8px 22px; background: var(--bg);
    border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  #jump:empty { display: none; }
  #jump button { border: 0; background: var(--surface); color: var(--text-2); padding: 3px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  #jump button:hover { color: var(--text); background: var(--surface-2); }
  .block { padding: 18px 22px; }
  .block + .block { border-top: 1px solid var(--border); }
  #cardBox .wc-word { font-size: calc(30px * var(--scale)); }
  .dict-name { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2);
    margin: 0 0 10px; letter-spacing: .02em; }
  .dict-name::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--accent); }
  .dict-name .grow { flex: 1; }
  .style-toggle { font-weight: 400; font-size: 12px; color: var(--text-3); letter-spacing: 0; }
  .style-toggle:hover { color: var(--accent-text); }
  #cardBox .wc-senses .txt { font-size: calc(17px * var(--scale)); }
  #cardBox .wc-senses .pos { font-size: calc(13.5px * var(--scale)); padding-top: 3px; }
  .welcome { padding: 60px 30px; text-align: center; color: var(--text-3); }
  .welcome .big { font: 600 22px var(--font-display); color: var(--text); margin-bottom: 8px; }
  .welcome kbd { font: 12px var(--font); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text-2); }
  .dym { margin-top: 12px; color: var(--text-2); }
  .dym a { display: inline-block; margin: 4px 12px 0 0; font-size: 15px; }
  .zoom { display: inline-flex; align-items: center; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="search">
      <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
      <input id="q" type="text" placeholder="查单词或中文" autocomplete="off" spellcheck="false">
      <button class="icon-btn clear" id="clear" title="清空" style="display:none"></button>
    </div>
    <span class="zoom">
      <button class="icon-btn" id="zoomOut" title="字号减小"></button>
      <button class="icon-btn" id="zoomIn" title="字号增大"></button>
    </span>
    <button class="icon-btn" id="vocabBtn" title="生词本"></button>
    <button class="icon-btn" id="setBtn" title="设置"></button>
  </header>
  <main>
    <aside id="side"></aside>
    <section id="content"><div id="jump"></div><div id="body"></div></section>
  </main>
</div>
<script src="common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = $("q"), side = $("side"), body = $("body"), jump = $("jump");
  var current = null, sugg = [], sel = -1, timer = null, autoTimer = null, saved = false;
  $("clear").innerHTML = WW.icon("x");
  $("zoomOut").innerHTML = WW.icon("minus");
  $("zoomIn").innerHTML = WW.icon("plus");
  $("vocabBtn").innerHTML = WW.icon("book");
  $("setBtn").innerHTML = WW.icon("settings");

  function welcome() {
    jump.innerHTML = "";
    var hk = WW.prefs.hotkeys || {}, mod = WW.prefs.modifier || "Shift";
    body.innerHTML = '<div class="welcome"><div class="big">查点什么？</div>' +
      "<div>输入英文或中文，回车查询；↑↓ 选择联想词</div>" +
      '<div style="margin-top:14px">按住 <kbd>' + WW.esc(mod) + "</kbd> 指向屏幕上的英文单词即可取词 · " +
      "选中文字后 <kbd>" + WW.esc(hk.translate || "") + "</kbd> 翻译</div></div>";
  }

  function renderSide(list, title, isHistory) {
    sugg = list || []; sel = -1;
    if (!sugg.length) {
      side.innerHTML = '<div class="title">' + WW.esc(title) + '</div><div class="empty" style="padding:4px 10px">' +
        (isHistory ? "还没有查词记录" : "没有联想词") + "</div>";
      return;
    }
    side.innerHTML = '<div class="title"><span>' + WW.esc(title) + "</span>" +
      (isHistory ? '<a id="clearHist">清空</a>' : "") + "</div>" +
      sugg.map(function (w, i) {
        var on = current && current.card && current.card.word && current.card.word.toLowerCase() === w.toLowerCase();
        return '<button class="item' + (on ? " on" : "") + '" data-i="' + i + '">' + WW.esc(w) + "</button>";
      }).join("");
  }
  function showHistory() { WW.api().recent().then(function (r) { renderSide(r, "最近查过", true); }); }
  function markSel() {
    side.querySelectorAll(".item").forEach(function (el, i) { el.classList.toggle("on", i === sel); });
    var el = side.querySelector(".item.on"); if (el) el.scrollIntoView({ block: "nearest" });
  }

  function actions() {
    return '<button class="icon-btn gold' + (saved ? " on" : "") + '" data-act="star" title="' + (saved ? "移出生词本" : "收进生词本") + '">' +
      WW.icon("star", saved) + "</button>" +
      '<button class="icon-btn" data-act="copy" title="复制单词">' + WW.icon("copy") + "</button>";
  }

  function render(r) {
    current = r;
    saved = !!r.saved;
    var card = r.card;
    if (!card) { body.innerHTML = '<div class="welcome">' + WW.esc(r.status || "") + "</div>"; jump.innerHTML = ""; return; }
    var h = '<article class="block" id="cardBox">' + WW.card(card, { actions: actions(), english: true });
    if (!card.found) {
      h += '<div class="dym">词典里没有「' + WW.esc(r.query) + "」";
      if ((r.did_you_mean || []).length) {
        h += "，你要找的是不是：<div>" + r.did_you_mean.map(function (w) {
          return '<a data-act="word" data-word="' + WW.esc(w) + '">' + WW.esc(w) + "</a>";
        }).join("") + "</div>";
      }
      h += "</div>";
    }
    h += "</article>";
    (r.entries || []).forEach(function (e, i) {
      h += '<article class="block" id="d' + i + '"><div class="dict-name"><span>' + WW.esc(e.name) + '</span><span class="grow"></span>' +
        '<a class="style-toggle" data-act="style">' + (WW.prefs.entry_style === "original" ? "清晰排版" : "原版排版") + "</a>" +
        '</div><div class="rich-host" id="rh' + i + '"></div></article>';
    });
    body.innerHTML = h;
    (r.entries || []).forEach(function (e, i) {
      WW.entry($("rh" + i), e, { word: search, headword: card.word });
    });
    var chips = (r.entries || []).length ? ['<button data-jump="cardBox">简明</button>'].concat(
      r.entries.map(function (e, i) { return '<button data-jump="d' + i + '">' + WW.esc(e.name) + "</button>"; })) : [];
    jump.innerHTML = chips.join("");
    $("content").scrollTop = 0;
  }

  function search(word, record) {
    word = String(word || "").trim();
    if (!word) return;
    if (q.value.trim() !== word) q.value = word;
    $("clear").style.display = "";
    WW.api().search(word, record !== false).then(function (r) {
      render(r);
      if (side.querySelector(".title span") && side.querySelector(".title span").textContent === "最近查过") showHistory();
      else markCurrent();
    });
  }
  function markCurrent() {
    var w = current && current.card && current.card.word;
    side.querySelectorAll(".item").forEach(function (el) {
      el.classList.toggle("on", !!w && el.textContent.toLowerCase() === w.toLowerCase());
    });
  }

  q.addEventListener("input", function () {
    var v = q.value.trim();
    $("clear").style.display = v ? "" : "none";
    clearTimeout(timer); clearTimeout(autoTimer);
    if (!v) { showHistory(); return; }
    timer = setTimeout(function () {
      WW.api().suggest(v).then(function (list) { renderSide(list, "联想", false); markCurrent(); });
    }, 60);
    autoTimer = setTimeout(function () { search(v, false); }, 320);  // 输入即查（不记入历史）
  });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!sugg.length) return;
      e.preventDefault();
      sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + sugg.length) % sugg.length;
      markSel();
      q.value = sugg[sel];
      clearTimeout(autoTimer);
      autoTimer = setTimeout(function () { search(sugg[sel], false); }, 120);
    } else if (e.key === "Enter") {
      e.preventDefault(); clearTimeout(autoTimer);
      search(q.value, true);
      q.select();
    } else if (e.key === "Escape" && q.value) {
      e.preventDefault(); q.value = ""; $("clear").style.display = "none"; showHistory();
    }
  });
  $("clear").addEventListener("click", function () { q.value = ""; $("clear").style.display = "none"; q.focus(); showHistory(); });
  side.addEventListener("click", function (e) {
    if (e.target.id === "clearHist") { WW.api().clear_history().then(showHistory); return; }
    var b = e.target.closest(".item"); if (b) search(sugg[parseInt(b.getAttribute("data-i"), 10)], true);
  });
  jump.addEventListener("click", function (e) {
    var b = e.target.closest("[data-jump]"); if (!b) return;
    var el = $(b.getAttribute("data-jump"));
    $("content").scrollTo({ top: el.offsetTop - jump.offsetHeight, behavior: "smooth" });
  });
  body.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t || !current) return;
    var act = t.getAttribute("data-act"), word = (current.card && current.card.word) || current.query;
    if (act === "say") WW.sayWord(current.card || { word: word }, t.getAttribute("data-accent"), t);
    else if (act === "word") search(t.getAttribute("data-word"), true);
    else if (act === "copy") { WW.api().copy(word); WW.toast("已复制 " + word); }
    else if (act === "style") {
      var top = $("content").scrollTop;
      WW.api().set_entry_style(WW.prefs.entry_style === "original" ? "clear" : "original").then(function (p) {
        WW.setPrefs(p); render(current); $("content").scrollTop = top;
      });
    }
    else if (act === "star") {
      var brief = ((current.card && current.card.senses) || []).slice(0, 3).map(function (s) { return (s.pos + " " + s.text).trim(); }).join("；");
      WW.api().vocab_toggle(word, brief).then(function (on) {
        saved = on; current.saved = on;
        var c = t.closest(".wc-actions"); if (c) c.innerHTML = actions();
        WW.toast(on ? "已收进生词本" : "已移出生词本");
      });
    }
  });
  function zoom(d) {
    var s = Math.round(((WW.prefs.font_scale || 1) + d) * 10) / 10;
    s = Math.max(0.8, Math.min(1.6, s));
    WW.api().set_font_scale(s).then(WW.setPrefs);
  }
  $("zoomOut").addEventListener("click", function () { zoom(-0.1); });
  $("zoomIn").addEventListener("click", function () { zoom(0.1); });
  $("vocabBtn").addEventListener("click", function () { WW.api().open_vocab(); });
  $("setBtn").addEventListener("click", function () { WW.api().open_settings(); });
  WW.selectionTool(function (t) { search(t, true); });

  WW.open = function (d) {
    d = d || {};
    if (d.prefs) WW.setPrefs(d.prefs);
    setTimeout(function () { q.focus(); q.select(); }, 30);
    if (d.word) search(d.word, true);
    else if (!current) { welcome(); showHistory(); }
  };
  WW.boot("lookup", function () { if (!current) { welcome(); showHistory(); } q.focus(); });
})();
</script>
</body>
</html>
