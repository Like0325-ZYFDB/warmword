<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(165deg, #faf6ee 0%, #f5eddd 100%);
    font-family: "Microsoft YaHei", sans-serif;
    color: #3d3229;
  }
  .wrap { padding: 14px 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .title {
    font-family: "KaiTi", "STKaiti", serif; font-size: 18px; color: #7a5c3e;
    letter-spacing: 2px; margin-bottom: 9px; flex: none;
  }
  .title .deco { color: #c2a06a; font-size: 14px; margin: 0 5px; }
  .title { display: flex; align-items: center; }
  .title .size { margin-left: auto; display: flex; gap: 4px; }
  .title .size .btn { font-family: "Microsoft YaHei", sans-serif; letter-spacing: 0; padding: 2px 8px; }
  .recent { margin-top: 16px; text-align: left; }
  .recent .lbl { font-size: 12px; color: #a08c6e; margin-bottom: 6px; display: flex; }
  .recent .lbl a { margin-left: auto; color: #b8a585; cursor: pointer; }
  .recent .w { display: inline-block; margin: 3px 4px; padding: 2px 10px; border-radius: 9px;
               border: 1px solid #e2d5bb; color: #6b4a2b; cursor: pointer; font-size: 13px; }
  .recent .w:hover { background: #b06a3f; color: #fff; border-color: #b06a3f; }
  .search-box { position: relative; flex: none; }
  #q {
    width: 100%; box-sizing: border-box;
    border: 1px solid #d9c8a6; border-radius: 12px;
    background: #fffdf7; padding: 10px 13px; font-size: 15px;
    color: #3d3229; outline: none;
  }
  #q:focus { border-color: #b06a3f; }
  .suggest {
    position: absolute; z-index: 9; left: 0; right: 0; top: 43px;
    background: #fffdf7; border: 1px solid #e2d5bb; border-radius: 10px;
    box-shadow: 0 8px 20px rgba(110, 88, 56, .16); overflow: hidden;
        max-height: 240px; overflow-y: auto;
  }
  .suggest div { padding: 7px 13px; font-size: 13px; cursor: pointer; color: #5a4a36; }
  .suggest div:hover, .suggest div.on { background: #f3e8d2; }
  .dym { margin-top: 14px; }
  .dym a { display: inline-block; margin: 4px 5px; padding: 3px 11px; border-radius: 9px;
           border: 1px solid #d9c8a6; color: #8a6a45; cursor: pointer; text-decoration: none; }
  .dym a:hover { background: #b06a3f; color: #fff; border-color: #b06a3f; }
  .body {
    margin-top: 10px; flex: 1; overflow-y: auto;
    background: #fffdf7; border: 1px solid #e2d5bb; border-radius: 14px;
    padding: 11px 14px;
  }
  .body::-webkit-scrollbar { width: 7px; }
  .body::-webkit-scrollbar-thumb { background: #d8cbb2; border-radius: 4px; }
  .entry { padding: 8px 2px; border-bottom: 1px dashed #d8cbb2; }
  .entry:last-child { border-bottom: none; }
  .dict-name {
    display: inline-block; font-size: 11px; color: #fff; background: #a9895f;
    border-radius: 8px; padding: 1px 9px; margin-bottom: 5px;
    font-family: "KaiTi", serif; letter-spacing: 1px;
  }
  .def-body { font-size: 14.5px; line-height: 1.9; color: #3f342a; word-break: break-word; }
  .def-body b, .def-body strong { color: #b06a3f; font-weight: 600; }
  .def-body i, .def-body em { color: #8a7a66; }
  .def-body .cn { color: #8a5a2b; }
  .def-body .phon { color: #9c8b72; font-style: italic; font-size: .94em; letter-spacing: .3px; }
  .def-body .pos {
    display: inline-block; background: #b06a3f; color: #fff;
    border-radius: 8px; padding: 0 8px; font-size: 12px; line-height: 1.6; margin-right: 4px;
  }
  .def-body .num {
    display: inline-block; background: #f0e4cf; color: #8a5a2b;
    border-radius: 7px; padding: 0 7px; font-size: 12.5px; font-weight: 600;
  }
  .word-head {
    font-family: "KaiTi", serif; font-size: 24px; color: #6b4a2b;
    margin: 0 0 8px; display: flex; align-items: center; gap: 8px;
  }
  .word-head .btn { font-family: "Microsoft YaHei", sans-serif; }
  .empty { color: #a08c6e; text-align: center; padding: 40px 10px; font-size: 13px; }
  .btn {
    border: 1px solid #d9c8a6; background: #fffaf0; color: #8a6a45;
    border-radius: 9px; padding: 3px 10px; font-size: 12px; cursor: pointer;
  }
  .btn:hover { background: #b06a3f; color: #fff; border-color: #b06a3f; }
  .hint {
    flex: none; margin-top: 7px; font-size: 11px; color: #a08c6e;
    font-family: "KaiTi", serif; letter-spacing: .5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
</style>
<!--WW_COMMON-->
</head>
<body>
<div class="wrap">
  <div class="title"><span class="deco">✿</span>暖词 · 快捷查词<span class="deco">✎</span>
    <span class="size"><button class="btn" onclick="zoom(-0.1)" title="释义字号缩小">A−</button><button class="btn" onclick="zoom(0.1)" title="释义字号放大">A+</button></span></div>
  <div class="search-box">
    <input id="q" placeholder="输入单词或中文，回车查词…" autocomplete="off" spellcheck="false">
    <div class="suggest" id="suggest" style="display:none"></div>
  </div>
  <div class="body" id="body">
    <div class="empty">输入单词开始查词<br><br>—— 词典在手，慢慢探索 ——<div class="recent" id="recent"></div></div>
  </div>
  <div class="hint">↑↓ 选补全 · Esc 关闭　·　<span data-hk="translate">Ctrl+Alt+T</span> 翻译选中　·　<span data-hk="capture">Ctrl+Alt+E</span> 取词　·　变形自动回溯</div>
</div>
<script>
  var timer = null, currentWord = "", seq = 0, active = -1, suggestWords = [];
  var q = document.getElementById("q");
  var suggestBox = document.getElementById("suggest");

  q.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(doSearch, 220);
  });
  q.addEventListener("keydown", function (e) {
    var open = suggestBox.style.display === "block" && suggestWords.length;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (!open) return;
      e.preventDefault();
      var n = suggestWords.length;
      active = e.key === "ArrowDown" ? (active + 1) % n : (active - 1 + n) % n;
      highlight();
      return;
    }
    if (e.key === "Enter") {
      clearTimeout(timer);
      if (open && active >= 0) { pickSuggest(suggestWords[active]); return; }
      hideSuggest();
      doSearch(true, true);
    }
    if (e.key === "Escape") {
      if (open) { hideSuggest(); return; }  // 先收起补全，再按一次 Esc 关窗
      window.pywebview.api.close_window("lookup");
    }
  });
  document.addEventListener("click", function (e) {
    if (!e.target.closest || !e.target.closest(".search-box")) hideSuggest();
  });

  function esc(s) {
    return (s || "").replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }
  function hideSuggest() { suggestBox.style.display = "none"; active = -1; }
  function highlight() {
    Array.prototype.forEach.call(suggestBox.children, function (el, i) {
      el.classList.toggle("on", i === active);
    });
  }

  // record=true：明确查的词（回车、选补全、点链接）才记进历史，打字过程中的半截词不记
  function doSearch(noSuggest, record) {
    var w = q.value.trim();
    var my = ++seq;  // 打字快时旧请求可能后回来，只认最新一次
    if (!w) { hideSuggest(); showRecent(); return; }
    window.pywebview.api.search(w, record === true).then(function (data) {
      if (my === seq) renderLookup(data);
    });
    if (noSuggest === true) return;
    window.pywebview.api.suggest(w).then(function (words) {
      if (my !== seq) return;
      suggestWords = words || [];
      active = -1;
      if (!suggestWords.length || (suggestWords.length === 1 && suggestWords[0] === w.toLowerCase())) {
        hideSuggest();
        return;
      }
      var html = "";
      suggestWords.forEach(function (x, i) {
        html += '<div data-i="' + i + '">' + esc(x) + '</div>';
      });
      suggestBox.innerHTML = html;
      suggestBox.style.display = "block";
    });
  }
  suggestBox.addEventListener("click", function (e) {
    var el = e.target.closest && e.target.closest("[data-i]");
    if (el) pickSuggest(suggestWords[+el.dataset.i]);
  });

  function pickSuggest(w) {
    q.value = w;
    hideSuggest();
    clearTimeout(timer);
    doSearch(true, true);
  }
  window.lookupWord = pickSuggest;

  function showRecent() {
    var body = document.getElementById("body");
    body.innerHTML = '<div class="empty">输入单词开始查词<br><br>—— 词典在手，慢慢探索 ——<div class="recent" id="recent"></div></div>';
    window.pywebview.api.recent().then(function (words) {
      var box = document.getElementById("recent");
      if (!box || !words || !words.length) return;
      var html = '<div class="lbl">最近查过<a onclick="clearRecent()">清空</a></div>';
      words.forEach(function (w) {
        html += '<span class="w" data-w="' + esc(w).replace(/"/g, "&quot;") + '">' + esc(w) + '</span>';
      });
      box.innerHTML = html;
    });
  }
  window.clearRecent = function () {
    window.pywebview.api.clear_history().then(showRecent);
  };
  window.zoom = function (d) {
    var v = Math.round(((WW.prefs.font_scale || 1) + d) * 10) / 10;
    window.pywebview.api.set_font_scale(v).then(WW.setPrefs);
  };
  window.addEventListener("pywebviewready", showRecent);

  window.renderLookup = function (data) {
    currentWord = data.word || "";
    var body = document.getElementById("body");
    if (data.word && q.value.trim() !== data.word) q.value = data.word;
    if (!data.entries || !data.entries.length) {
      var html = '<div class="empty">「' + esc(data.word) + '」没有找到释义';
      if (data.status) {
        html += '<br><br>' + esc(data.status);
      } else if (data.did_you_mean && data.did_you_mean.length) {
        html += '<div class="dym">你要找的是不是：<br>';
        data.did_you_mean.forEach(function (x) {
          html += '<a data-w="' + esc(x).replace(/"/g, "&quot;") + '">' + esc(x) + '</a>';
        });
        html += '</div>';
      } else {
        html += '<br><br>换个词试试？';
      }
      body.innerHTML = html + '</div>';
      return;
    }
    var head = '<div class="word-head">' + esc(data.word) +
      '<button class="btn" onclick="speak(\'uk\')">英</button>' +
      '<button class="btn" onclick="speak(\'us\')">美</button>' +
      '<button class="btn" id="vbtn" onclick="addVocabWord()">收藏</button></div>';
    body.innerHTML = head + '<div id="entries"></div>';
    // 词典原版排版；多本词典时顶部可跳转；双击释义里的词 / 点词条链接直接在这里查
    WW.render(document.getElementById("entries"), data.entries, { nav: true, onEntry: pickSuggest });
    document.body.scrollTop = 0;
    body.scrollTop = 0;
  };
  document.getElementById("body").addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".dym a, .recent .w");
    if (a) pickSuggest(a.dataset.w);
  });

  function speak(accent) {
    if (currentWord) window.pywebview.api.speak(currentWord, accent);
  }

  function addVocabWord() {
    if (!currentWord) return;
    window.pywebview.api.add_vocab(currentWord).then(function (ok) {
      var b = document.getElementById("vbtn");
      if (!b) return;
      b.textContent = ok ? "已收藏" : "已存在";
      b.style.background = ok ? "#6a8f6b" : "#c9b79a";
      b.style.color = "#fff";
      setTimeout(function () { b.textContent = "收藏"; b.style.background = ""; b.style.color = ""; }, 1600);
    });
  }

  window.focusSearch = function () { q.focus(); q.select(); };

  // 快捷键提示文字跟着设置走（改键后不用改页面）
  window.setHotkeys = function (hk) {
    document.querySelectorAll("[data-hk]").forEach(function (el) {
      if (hk && hk[el.dataset.hk]) el.textContent = hk[el.dataset.hk];
    });
  };
  window.addEventListener("pywebviewready", function () {
    window.pywebview.api.get_hotkeys().then(window.setHotkeys);
  });
</script>
</body>
</html>
