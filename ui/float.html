<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一瞥 · 取词</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body { box-shadow: inset 0 0 0 1px var(--border); border-radius: 8px; }
  #wrap { height: 100vh; display: flex; flex-direction: column; }
  #scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
  #card { padding: 14px 16px 12px; }
  #rich { padding: 12px 16px 14px; }
  .hidden { display: none !important; }
  #tabs {
    flex: none; display: flex; align-items: center; gap: 2px; padding: 5px 8px;
    border-top: 1px solid var(--border); background: var(--bg); overflow-x: auto; scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  #tabs button {
    border: 0; background: transparent; color: var(--text-2); font-size: 12px; padding: 3px 9px;
    border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  #tabs button:hover { background: var(--hover); color: var(--text); }
  #tabs button.on { background: var(--surface); color: var(--text); font-weight: 600; }
  #tabs .grow { flex: 1; }
  #tabs .hint { font-size: 11px; color: var(--text-3); padding: 0 4px; white-space: nowrap; }
  .notfound { margin-top: 8px; color: var(--text-2); font-size: 13px; }
  .notfound a { margin-right: 10px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scroll">
    <div id="card"></div>
    <div id="rich" class="hidden"><div class="rich-host" id="richHost"></div></div>
  </div>
  <div id="tabs" class="hidden"></div>
</div>
<script src="common.js"></script>
<script>
(function () {
  var data = null, tab = -1, pinned = false, saved = false;
  var $ = function (id) { return document.getElementById(id); };

  function actions() {
    return '<button class="icon-btn' + (pinned ? " on" : "") + '" data-act="pin" title="钉住（不自动收起）">' + WW.icon("pin") + "</button>" +
      '<button class="icon-btn gold' + (saved ? " on" : "") + '" data-act="star" title="' + (saved ? "移出生词本" : "收进生词本") + '">' + WW.icon("star", saved) + "</button>" +
      '<button class="icon-btn" data-act="open" title="在查词窗里看完整释义">' + WW.icon("open") + "</button>";
  }

  function naturalHeight() {
    var tabs = $("tabs");
    return Math.ceil($("scroll").scrollHeight + (tabs.classList.contains("hidden") ? 0 : tabs.offsetHeight));
  }

  function renderCard() {
    var card = data.card || { word: data.query, found: false };
    var h = WW.card(card, { actions: actions(), compact: true });
    if (!card.found) {
      h += '<div class="notfound">' + WW.esc(data.status || "词典里没有这个词");
      if ((data.did_you_mean || []).length) {
        h += '<div style="margin-top:6px">你要找的是不是：' + data.did_you_mean.map(function (w) {
          return '<a data-act="word" data-word="' + WW.esc(w) + '">' + WW.esc(w) + "</a>";
        }).join("") + "</div>";
      }
      h += "</div>";
    } else if (data.status) {
      h += '<div class="wc-note">' + WW.esc(data.status) + "</div>";
    }
    $("card").innerHTML = h;
  }

  function renderTabs() {
    var entries = data.entries || [];
    var tabs = $("tabs");
    if (!entries.length) { tabs.classList.add("hidden"); tabs.innerHTML = ""; return; }
    tabs.classList.remove("hidden");
    var h = '<button data-tab="-1" class="' + (tab < 0 ? "on" : "") + '">简明</button>';
    entries.forEach(function (e, i) {
      h += '<button data-tab="' + i + '" class="' + (tab === i ? "on" : "") + '">' + WW.esc(e.name) + "</button>";
    });
    h += '<span class="grow"></span><span class="hint">Esc 关闭</span>';
    tabs.innerHTML = h;
  }

  function showTab(i) {
    tab = i;
    $("card").classList.toggle("hidden", i >= 0);
    $("rich").classList.toggle("hidden", i < 0);
    if (i >= 0) {
      var e = data.entries[i];
      WW.rich($("richHost"), e, { word: function (w) { WW.api().float_word(w); }, headword: data.card && data.card.word });
    }
    renderTabs();
    $("scroll").scrollTop = 0;
  }

  function resize() { WW.api().float_resize(naturalHeight()); }

  WW.render = function (d) {
    data = d || {};
    pinned = !!data.pinned;
    saved = !!data.saved;
    if (data.prefs) WW.setPrefs(data.prefs);
    tab = -1;
    renderCard();
    $("card").classList.remove("hidden");
    $("rich").classList.add("hidden");
    if ($("richHost").shadowRoot) $("richHost").shadowRoot.innerHTML = "";
    renderTabs();
    $("scroll").scrollTop = 0;
    return naturalHeight();
  };
  WW.reset = function () { pinned = false; };
  WW.setSaved = function (b) { saved = !!b; if (data) renderCard(); };
  WW.speakHead = function () { if (data && data.card) WW.say(data.card.word); };

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act],[data-tab]");
    if (!t || !data) return;
    if (t.hasAttribute("data-tab")) { showTab(parseInt(t.getAttribute("data-tab"), 10)); resize(); setTimeout(resize, 400); return; }
    var act = t.getAttribute("data-act"), word = (data.card && data.card.word) || data.query;
    if (act === "say") WW.say(word, t.getAttribute("data-accent"), t);
    else if (act === "word") WW.api().float_word(t.getAttribute("data-word"));
    else if (act === "pin") { pinned = !pinned; WW.api().float_pin(pinned); renderCard(); }
    else if (act === "open") WW.api().open_lookup(word);
    else if (act === "star") {
      var brief = ((data.card && data.card.senses) || []).slice(0, 3).map(function (s) { return (s.pos + " " + s.text).trim(); }).join("；");
      WW.api().vocab_toggle(word, brief).then(function (on) {
        saved = on; renderCard(); WW.toast(on ? "已收进生词本" : "已移出生词本");
      });
    }
  });
  document.addEventListener("keydown", function (e) {
    if (!data || !(data.entries || []).length) return;
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      var n = data.entries.length, i = tab + (e.key === "ArrowRight" ? 1 : -1);
      if (i < -1) i = n - 1; if (i >= n) i = -1;
      showTab(i); resize();
    }
  });
  WW.boot("float");
})();
</script>
</body>
</html>
