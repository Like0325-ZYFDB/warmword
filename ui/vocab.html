<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一瞥 · 生词本</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  #app { height: 100vh; display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  h1 { font: 600 18px var(--font-display); margin: 0 8px 0 0; }
  .count { color: var(--text-3); font-size: 13px; }
  .grow { flex: 1; }
  #filter { width: 180px; }
  #list { overflow-y: auto; padding: 6px 10px 16px; }
  .row { display: grid; grid-template-columns: minmax(110px, 180px) 1fr auto auto; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 8px; }
  .row:hover { background: var(--hover); }
  .row .w { font-weight: 600; cursor: pointer; font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .row .w:hover { color: var(--accent-text); }
  .row .b { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .d { color: var(--text-3); font-size: 12px; white-space: nowrap; }
  .row .ops { display: flex; gap: 2px; opacity: .35; }
  .row:hover .ops { opacity: 1; }
  .empty-state { padding: 70px 20px; text-align: center; color: var(--text-3); }
  .empty-state .big { font: 600 18px var(--font-display); color: var(--text); margin-bottom: 6px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>生词本</h1><span class="count" id="count"></span>
    <span class="grow"></span>
    <input id="filter" type="search" placeholder="筛选" spellcheck="false">
    <button class="btn" id="csv"></button>
    <button class="btn" id="anki"></button>
    <button class="icon-btn" id="folder" title="打开导出文件夹"></button>
    <button class="icon-btn" id="clearAll" title="清空生词本"></button>
  </header>
  <div id="list"></div>
</div>
<script src="common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var items = [];
  $("csv").innerHTML = WW.icon("download") + "导出 CSV";
  $("anki").innerHTML = WW.icon("download") + "导出 Anki";
  $("folder").innerHTML = WW.icon("folder");
  $("clearAll").innerHTML = WW.icon("trash");

  function draw() {
    var f = $("filter").value.trim().toLowerCase();
    var shown = items.filter(function (i) { return !f || (i.word + " " + (i.brief || "")).toLowerCase().indexOf(f) >= 0; });
    $("count").textContent = items.length ? "共 " + items.length + " 个" : "";
    if (!items.length) {
      $("list").innerHTML = '<div class="empty-state"><div class="big">收藏的单词会出现在这里</div>' +
        "<div>在取词浮窗或查词窗里点星标，或者按 " + WW.esc((WW.prefs.hotkeys || {}).add_vocab || "") + " 收藏鼠标下的词</div></div>";
      return;
    }
    $("list").innerHTML = shown.map(function (i) {
      var w = WW.esc(i.word);
      return '<div class="row"><span class="w" data-look="' + w + '">' + w + '</span><span class="b" title="' + WW.esc(i.brief) + '">' +
        WW.esc(i.brief || "") + '</span><span class="d">' + WW.esc((i.added_at || "").slice(0, 10)) + '</span><span class="ops">' +
        '<button class="icon-btn" data-say="' + w + '" title="发音">' + WW.icon("volume") + "</button>" +
        '<button class="icon-btn" data-del="' + w + '" title="移出生词本">' + WW.icon("x") + "</button></span></div>";
    }).join("") || '<div class="empty-state">没有匹配的单词</div>';
  }
  WW.refresh = function () { WW.api().vocab_list().then(function (r) { items = r || []; draw(); }); };

  $("filter").addEventListener("input", draw);
  $("list").addEventListener("click", function (e) {
    var t = e.target.closest("[data-look],[data-say],[data-del]"); if (!t) return;
    if (t.hasAttribute("data-say")) WW.say(t.getAttribute("data-say"), null, t);
    else if (t.hasAttribute("data-look")) WW.api().open_lookup(t.getAttribute("data-look"));
    else WW.api().vocab_remove(t.getAttribute("data-del")).then(WW.refresh);
  });
  function exported(path) {
    if (path) { WW.toast("已导出到「导出」文件夹"); WW.api().open_folder("export"); } else WW.toast("生词本是空的");
  }
  $("csv").addEventListener("click", function () { WW.api().export_csv().then(exported); });
  $("anki").addEventListener("click", function () { WW.api().export_anki().then(exported); });
  $("folder").addEventListener("click", function () { WW.api().open_folder("export"); });
  $("clearAll").addEventListener("click", function () {
    if (!items.length) return;
    if (confirm("清空生词本里的 " + items.length + " 个单词？这一步不能撤销。")) WW.api().vocab_clear().then(WW.refresh);
  });
  WW.onPrefs = function () { if (!items.length) draw(); };
  WW.boot("vocab", WW.refresh);
})();
</script>
</body>
</html>
