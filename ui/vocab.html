<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: linear-gradient(165deg, #faf6ee 0%, #f5eddd 100%);
    font-family: "Microsoft YaHei", sans-serif;
    color: #3d3229;
  }
  .wrap { padding: 14px 16px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
  .title {
    font-family: "KaiTi", "STKaiti", serif; font-size: 18px; color: #7a5c3e;
    letter-spacing: 2px; margin-bottom: 10px; flex: none;
    display: flex; align-items: center; gap: 8px;
  }
  .title .deco { color: #c2a06a; font-size: 14px; margin: 0 4px; }
  .title .btn { margin-left: auto; }
  .title .btn + .btn { margin-left: 6px; }
  .list { flex: 1; overflow-y: auto; }
  .list::-webkit-scrollbar { width: 7px; }
  .list::-webkit-scrollbar-thumb { background: #d8cbb2; border-radius: 4px; }
  .item {
    background: #fffdf7; border: 1px solid #e2d5bb; border-radius: 12px;
    padding: 9px 13px; margin-bottom: 7px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .word {
    font-family: "KaiTi", serif; font-size: 17px; font-weight: 700; color: #6b4a2b;
    min-width: 130px; word-break: break-all;
  }
  .meta { flex: 1; min-width: 0; }
  .brief {
    font-size: 12.5px; color: #6a5a46; line-height: 1.6;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .time { font-size: 11px; color: #a08c6e; margin-top: 3px; }
  .ops { display: flex; gap: 5px; flex: none; }
  .btn {
    border: 1px solid #d9c8a6; background: #fffaf0; color: #8a6a45;
    border-radius: 9px; padding: 3px 10px; font-size: 12px; cursor: pointer;
    font-family: "Microsoft YaHei", sans-serif;
  }
  .btn:hover { background: #b06a3f; color: #fff; border-color: #b06a3f; }
  .empty { color: #a08c6e; text-align: center; padding: 60px 10px; font-size: 13px; line-height: 2; }
  .hint {
    flex: none; margin-top: 8px; font-size: 11px; color: #a08c6e;
    font-family: "KaiTi", serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tip { font-size: 12px; color: #8a6a45; margin-left: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title"><span class="deco">✿</span>暖词 · 生词本<span class="deco">✎</span>
    <span class="tip" id="count"></span>
    <button class="btn" onclick="exportCsv()">导出表格</button>
    <button class="btn" onclick="clearAll()">清空</button>
    <button class="btn" onclick="closeMe()">关闭</button>
  </div>
  <div class="list" id="list"><div class="empty">还没有收藏的单词<br><br>取词后点小窗上的「收藏」，或按 Ctrl+Shift+A</div></div>
  <div class="hint">按 Ctrl+Shift+A 把鼠标下的词收进生词本　·　导出文件在程序目录的「导出」文件夹</div>
</div>
<script>
  function esc(s) {
    return (s || "").replace(/[&<>]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
    });
  }

  window.renderVocab = function (data) {
    var items = data.items || [];
    document.getElementById("count").textContent = items.length ? "共 " + items.length + " 个" : "";
    var box = document.getElementById("list");
    if (!items.length) {
      box.innerHTML = '<div class="empty">还没有收藏的单词<br><br>取词后点小窗上的「收藏」，或按 Ctrl+Shift+A</div>';
      return;
    }
    var html = "";
    items.forEach(function (it) {
      html += '<div class="item">' +
        '<div class="word">' + esc(it.word) + '</div>' +
        '<div class="meta"><div class="brief">' + esc(it.brief || "（无释义）") + '</div>' +
        '<div class="time">' + esc(it.added_at || "") + '</div></div>' +
        '<div class="ops">' +
          '<button class="btn" onclick="speak(\'' + esc(it.word).replace(/'/g, "") + '\')">发音</button>' +
          '<button class="btn" onclick="del(\'' + esc(it.word).replace(/'/g, "") + '\')">删除</button>' +
        '</div></div>';
    });
    box.innerHTML = html;
  };

  function reload() {
    window.pywebview.api.list_vocab().then(function (items) {
      window.renderVocab({ items: items });
    });
  }
  function speak(w) { window.pywebview.api.speak_word(w, "us"); }
  function del(w) {
    window.pywebview.api.remove_vocab(w).then(function () { reload(); });
  }
  function clearAll() {
    window.pywebview.api.list_vocab().then(function (items) {
      if (!items.length) return;
      var chain = Promise.resolve();
      items.forEach(function (it) {
        chain = chain.then(function () { return window.pywebview.api.remove_vocab(it.word); });
      });
      chain.then(function () { reload(); });
    });
  }
  function exportCsv() {
    window.pywebview.api.export_vocab().then(function (path) {
      document.getElementById("hint") && 0;
      var el = document.getElementById("count");
      el.textContent = path ? "已导出：" + path.split("\\").pop() : "生词本是空的";
    });
  }
  function closeMe() { window.pywebview.api.close_window("vocab"); }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeMe();
  });
  reload();
</script>
</body>
</html>
