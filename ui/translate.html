<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一瞥 · 翻译</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; }
  body { overflow-y: auto; }
  .wrap { padding: 16px 20px 20px; }
  .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); margin: 0 0 6px; }
  .label .grow { flex: 1; }
  #src { width: 100%; min-height: 72px; max-height: 200px; font-size: calc(14px * var(--scale)); background: var(--surface); border-color: transparent; }
  #src:focus { background: var(--bg); }
  .out { margin-top: 16px; }
  #dst { font-size: calc(16px * var(--scale)); line-height: 1.75; white-space: pre-wrap; user-select: text; min-height: 28px; }
  #dst.loading { color: var(--text-3); }
  .src-name { font-size: 11.5px; color: var(--text-3); margin-top: 6px; }
  .words { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
  .row { display: grid; grid-template-columns: 22px minmax(90px, auto) 1fr auto; align-items: center; gap: 8px;
    padding: 5px 4px; border-radius: 6px; }
  .row:hover { background: var(--hover); }
  .row .w { font-weight: 600; cursor: pointer; }
  .row .w:hover { color: var(--accent-text); }
  .row .b { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .icon-btn { width: 24px; height: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="label"><span>原文</span><span class="grow"></span>
    <button class="icon-btn" id="sayBtn" title="朗读原文"></button>
    <button class="btn" id="goBtn" title="Ctrl+Enter">重新翻译</button>
  </div>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="out">
    <div class="label"><span>译文</span><span class="grow"></span><button class="icon-btn" id="copyBtn" title="复制译文"></button></div>
    <div id="dst"></div>
    <div class="src-name" id="srcName"></div>
  </div>
  <div class="words" id="words" style="display:none"></div>
</div>
<script src="common.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var data = {};
  $("sayBtn").innerHTML = WW.icon("volume");
  $("copyBtn").innerHTML = WW.icon("copy");

  WW.render = function (d) {
    data = d || {};
    if (d.prefs) WW.setPrefs(d.prefs);
    $("src").value = d.original || "";
    var dst = $("dst");
    if (d.loading) { dst.className = "loading"; dst.textContent = "翻译中…"; $("srcName").textContent = ""; }
    else if (d.translated) { dst.className = ""; dst.textContent = d.translated; $("srcName").textContent = d.source ? "来自 " + d.source : ""; }
    else {
      dst.className = "loading";
      dst.textContent = d.online === false ? "联网翻译已关闭（设置里可以打开），下面是句中生词" : "翻译失败：网络连不上翻译服务。可以在设置里填百度翻译的密钥";
      $("srcName").textContent = "";
    }
    var words = d.words || [];
    var box = $("words");
    if (!words.length || d.loading) { box.style.display = "none"; return; }
    box.style.display = "";
    box.innerHTML = '<div class="label">句中生词（常用词已略过）</div>' + words.map(function (w, i) {
      return '<div class="row"><button class="icon-btn gold' + (w.saved ? " on" : "") + '" data-star="' + i + '" title="收进生词本">' +
        WW.icon("star", w.saved) + '</button><span class="w" data-look="' + WW.esc(w.word) + '">' + WW.esc(w.word) +
        '</span><span class="b" title="' + WW.esc(w.brief) + '">' + WW.esc(w.brief) + '</span>' +
        '<button class="icon-btn" data-say="' + WW.esc(w.word) + '" title="发音">' + WW.icon("volume") + "</button></div>";
    }).join("");
  };

  function retranslate() { var t = $("src").value.trim(); if (t) WW.api().translate_text(t); }
  $("goBtn").addEventListener("click", retranslate);
  $("src").addEventListener("keydown", function (e) { if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); retranslate(); } });
  $("sayBtn").addEventListener("click", function (e) { WW.say($("src").value, null, e.currentTarget); });
  $("copyBtn").addEventListener("click", function () { if (data.translated) { WW.api().copy(data.translated); WW.toast("已复制译文"); } });
  $("words").addEventListener("click", function (e) {
    var t = e.target.closest("[data-star],[data-look],[data-say]"); if (!t) return;
    if (t.hasAttribute("data-say")) WW.say(t.getAttribute("data-say"), null, t);
    else if (t.hasAttribute("data-look")) WW.api().open_lookup(t.getAttribute("data-look"));
    else {
      var w = data.words[parseInt(t.getAttribute("data-star"), 10)];
      WW.api().vocab_toggle(w.word, w.brief).then(function (on) {
        w.saved = on; t.classList.toggle("on", on); t.innerHTML = WW.icon("star", on);
        WW.toast(on ? "已收进生词本" : "已移出生词本");
      });
    }
  });
  WW.selectionTool(function (t) { WW.api().open_lookup(t); });
  WW.boot("translate");
})();
</script>
</body>
</html>
